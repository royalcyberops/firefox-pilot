<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font-family:sans-serif;width:220px;padding:10px}
#s{font-weight:bold}
</style></head>
<body>
<div>Status: <span id="s">…</span></div>
<script>
const B = typeof browser !== "undefined" ? browser : chrome;
B.storage.local.get("status").then(s => {
  document.getElementById("s").textContent = s.status || "unknown";
});
</script>
</body></html>
